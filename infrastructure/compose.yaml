name: cascadeshield
services:
  database:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cascadeshield}
      POSTGRES_USER: ${POSTGRES_USER:-cascadeshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cascadeshield}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 60s
volumes:
  database_data:
