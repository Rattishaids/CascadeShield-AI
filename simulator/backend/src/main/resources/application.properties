server.address=0.0.0.0
server.port=${PORT:8080}
spring.datasource.url=${SIMULATOR_JDBC_URL}
spring.datasource.username=${SIMULATOR_DB_USER}
spring.datasource.password=${SIMULATOR_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.schemas=cascadeshield_sim
spring.flyway.default-schema=cascadeshield_sim
spring.jackson.serialization.write-dates-as-timestamps=false
simulator.graph-path=${SIMULATOR_GRAPH_PATH:../../data/processed/chennai_osm/road_graph.json}
simulator.geojson-path=${SIMULATOR_GEOJSON_PATH:../../data/processed/chennai_osm/roads.geojson}
spring.mvc.async.request-timeout=600000
server.error.include-message=always
