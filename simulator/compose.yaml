name: cascadeshield-simulator
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SIMULATOR_JDBC_URL: jdbc:postgresql://database:5432/cascadeshield
      SIMULATOR_DB_USER: cascadeshield
      SIMULATOR_DB_PASSWORD: cascadeshield
      SIMULATOR_GRAPH_PATH: /app/network/road_graph.json
      SIMULATOR_GEOJSON_PATH: /app/network/roads.geojson
    volumes:
      - ../data/processed/chennai_osm:/app/network:ro
    networks: [database]
    restart: unless-stopped
networks:
  database:
    external: true
    name: cascadeshield_default
